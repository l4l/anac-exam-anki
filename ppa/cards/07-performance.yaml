  explanation: 'Viento 360° a 20 nudos; componente cruzada = 20 × sen(ángulo):<br>Pista 32 (320°): 40°
    → 20 × 0,643 ≈ 12,9 nudos (dentro de 13)<br>Pista 6 (060°): 60° → 20 × 0,866 ≈ 17,3 nudos<br>Pista
    29 (290°): 70° → 20 × 0,940 ≈ 18,8 nudos<br>Solo la <b>Pista 32</b> queda dentro del límite de 13
    nudos.'
  theory: Solo la pista 32 queda dentro de los límites.
- id: k126
  source:
    key_item: 126
    chapter_question: '7.22'
  question: (Refiérase a la Figura 37) Con viento del sur informado a 20 nudos, ¿cuál pista (10, 14 o
    24) es adecuada para utilizar para un avión con un componente de viento cruzado máximo de 13 nudos?
  options:
    a: Pista 10.
    b: Pista 14.
    c: Pista 24.
  answer: b
  status: key_error
  official_key: c
  images:
  - ppa-figura-37.jpg
  explanation: 'Viento 180° a 20 nudos; componente cruzada = 20 × sen(ángulo):<br>Pista 10 (100°): 80°
    → 20 × 0,985 ≈ 19,7 nudos<br>Pista 24 (240°): 60° → 20 × 0,866 ≈ 17,3 nudos<br>Pista 14 (140°): 40°

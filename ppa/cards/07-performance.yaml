- id: k315
  source:
    key_item: 315
  question: 'El peso de despegue es:'
  options:
    a: es el peso del combustible utilizado
    b: el peso vacío más la carga útil
    c: es el peso de despegue menos el peso del combustible utilizado
  answer: b
  explanation: El peso de despegue es el <b>peso vacío más la carga útil</b> (tripulación, pasajeros,
    equipaje y combustible utilizable). La opción a describe solo el combustible consumido, y la opción
    c (peso de despegue menos el combustible utilizado) corresponde al peso de aterrizaje.
- id: k316
  source:
    key_item: 316
  question: El peso vacío consiste en
  options:
    a: la célula, los motores y todos los elementos de equipamiento operacional que tenga ubicaciones
      fijas y que se encuentren instalados en forma permanente en el avión.
    b: la célula, los motores.
    c: la célula, los motores y combustible
  answer: a
  explanation: El peso vacío comprende la <b>célula, los motores y todo el equipamiento operacional con
    ubicación fija instalado en forma permanente</b> en el avión (además del combustible no utilizable
    y el aceite no drenable). La opción b omite el equipamiento fijo, y la c es incorrecta porque el combustible
    utilizable forma parte de la carga útil.
- id: k326
  source:
    key_item: 326
  question: Gran altitud, alta temperatura y alta humedad
  options:
    a: son factores que no requieren cuidado en la limitación de la carga.
    b: No son factores que pueden requerir una limitación en la carga
    c: son factores adicionales que pueden requerir la limitación de la carga a un cierto peso menor que
      el máximo permitido.
  answer: c
  explanation: La gran altitud, la alta temperatura y la alta humedad aumentan la altitud de densidad
    y reducen la performance de despegue y ascenso. Por eso son <b>factores adicionales que pueden requerir
    limitar la carga</b> a un peso menor que el máximo permitido, para mantener distancias de despegue
    y régimen de ascenso aceptables. Las opciones a y b niegan este efecto.
- id: k346
  source:
    key_item: 346
  question: 'Mediante la Tabla de Altitud de Densidad que se muestra en la figuray las siguientes condiciones,
    determine la altitud de densidad. Condiciones: Ajuste del altímetro..............30.35 Temperatura
    del aeropuerto.............. +25° F Elevación del Aeropuerto.............. 3.894 pies'
  options:
    a: 3.500 pies
    b: 2500 pies
    c: 2000 pies
  answer: c
  images:
  - ppa-key-x339.jpg
  explanation: '1) Altitud de presión: en la tabla, 30.3 = −348 y 30.4 = −440 → para 30.35 ≈ −394 pies<br>AP

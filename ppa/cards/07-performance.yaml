    1300 pies</b><br>Un aumento de temperatura nunca disminuye la altitud de densidad, por eso la opción
    b es incorrecta.
  theory: 2950 − 1650 = aumento de 1300 pies.
- id: k073
  source:
    key_item: 73
    chapter_question: '7.15'
  question: ¿Qué efecto, si existe, produce alta humedad sobre la performance de la aeronave?
  options:
    a: Aumenta la performance.
    b: Disminuye la performance.
    c: No tiene efecto sobre la performance.
  answer: b
  explanation: 'El vapor de agua es más liviano que el aire seco, por lo que la alta humedad reduce la
    densidad del aire. Esto aumenta la altitud de densidad y <b>disminuye la performance</b>: menos potencia
    del motor, menor eficiencia de la hélice y menos sustentación. Por lo tanto no puede aumentarla ni
    ser indiferente.'
  theory: Un aumento de la humedad reduce considerablemente la potencia entregada y la eficiencia de la
    hélice.
- id: k079
  source:
    key_item: 79
    chapter_question: '7.16'
  question: ¿Qué efecto tiene la menor densidad del aire, comparado con el aire más denso, sobre la eficiencia
    de la hélice y por qué?
  options:
    a: Se aumenta la eficiencia debido a la menor fricción sobre las palas de la hélice.
    b: Se reduce la eficiencia porque la hélice ejerce menos tracción en aire menos denso que en el aire
      con mayor densidad.
    c: Se reduce la eficiencia debido a la fuerza incrementada de la hélice en aire más tenue.
  answer: b
  explanation: La hélice genera tracción acelerando una masa de aire; en aire menos denso hay menos masa
    sobre la que actuar, por lo que <b>la hélice ejerce menos tracción y su eficiencia se reduce</b>.
    La opción a es incorrecta porque la menor fricción no compensa la pérdida de tracción, y la c es incorrecta
    porque la fuerza de la hélice disminuye, no aumenta.
  theory: La eficiencia de la hélice se reduce en aire menos denso.
- id: k085
  source:
    key_item: 85
    chapter_question: '7.17'
  question: (Refiérase a la Figura 37) ¿Cuál es el componente de viento cruzado para un aterrizaje en
    la Pista 18 si la torre informa el viento de 220° a 30 nudos?
  options:
    a: 19 nudos.
    b: 23 nudos.
    c: 30 nudos.
  answer: a
  images:
  - ppa-figura-37.jpg
  explanation: 'Ángulo entre viento y pista = 220° − 180° = 40°<br>Componente de viento cruzado = 30 ×
    sen 40° = 30 × 0,643 ≈ 19,3 → <b>19 nudos</b><br>En la Figura 37: radial de 40° con el arco de 30
    nudos → 19 nudos sobre el eje horizontal.<br>23 nudos es la componente de viento de frente y 30 nudos
    es la velocidad total del viento.'
  theory: Componente de viento cruzado de 19 nudos; 23 nudos es la componente de frente y 30 nudos la
    velocidad del viento.
- id: k092
  source:
    key_item: 92
    chapter_question: '7.18'
  question: (Refiérase a la Figura 37) ¿Cuál es el componente de viento de frente para un aterrizaje en
    la Pista 18 si la torre informa el viento de 220° a 30 nudos?
  options:
    a: 19 nudos.
    b: 23 nudos.
    c: 26 nudos.
  answer: b
  images:
  - ppa-figura-37.jpg
  explanation: 'Ángulo entre viento y pista = 220° − 180° = 40°<br>Componente de viento de frente = 30
    × cos 40° = 30 × 0,766 ≈ <b>23 nudos</b><br>En la Figura 37: radial de 40° con el arco de 30 nudos
    → 23 nudos sobre el eje vertical.<br>19 nudos es la componente de viento cruzado.'
  theory: Componente de viento de frente de 23 nudos.
- id: k100
  source:
    key_item: 100
    chapter_question: '7.19'
  question: '(Refiérase a la Figura 37) Determine la velocidad de viento máxima para viento de frente
    de 45° si el componente máximo de viento cruzado para el avión es de 25 nudos:'
  options:
    a: 25 nudos.
    b: 29 nudos.
    c: 35 nudos.
  answer: c
  status: key_error
  official_key: a
  images:
  - ppa-figura-37.jpg
  explanation: Componente cruzada = velocidad del viento × sen(ángulo), entonces velocidad máxima = componente
    cruzada ÷ sen(ángulo).<br>25 ÷ sen 45° = 25 ÷ 0,707 ≈ 35,4 → <b>35 nudos</b><br>En la Figura 37, el
    radial de 45° corta la vertical de 25 nudos de viento cruzado entre los arcos de 30 y 40 nudos.<br>25
    nudos solo sería correcto con viento a 90° de la pista.
  theory: 'La intersección queda entre los arcos de 30 y 40 nudos: 35 nudos.'
- id: k112
  source:
    key_item: 112
    chapter_question: '7.20'
  question: (Refiérase a la Figura 37) ¿Cuál es la velocidad de viento máxima para viento cruzado de 30°
    si la componente máxima de viento cruzado para el avión es de 12 nudos?
  options:
    a: 16 nudos.
    b: 20 nudos.
    c: 24 nudos.
  answer: c
  images:
  - ppa-figura-37.jpg
  explanation: Velocidad máxima = componente cruzada máxima ÷ sen(ángulo)<br>12 ÷ sen 30° = 12 ÷ 0,5 =
    <b>24 nudos</b><br>En la Figura 37, la vertical de 12 nudos de viento cruzado corta el radial de 30°
    sobre el arco de ~24 nudos.<br>16 y 20 nudos darían componentes cruzadas de solo 8 y 10 nudos.
  theory: Aproximadamente 24 nudos.
- id: k122
  source:
    key_item: 122
    chapter_question: '7.21'
  question: (Refiérase a la Figura 37) Con viento del norte informado a 20 nudos, ¿cuál pista (6, 29 o
    32) es aceptable para utilizar para un avión con un componente de viento cruzado máximo de 13 nudos?
  options:
    a: Pista 6.
    b: Pista 29.
    c: Pista 32.
  answer: c
  images:

- id: k066
  source:
    key_item: 66
    chapter_question: '7.14'
  question: (Refiérase a la Figura 8) ¿Cuál es el efecto de un aumento de temperatura de 30 a 50° F en
    la altitud de densidad si la altitud de presión permanece en los 3000 pies MSL?
  options:
    a: Aumento de 900 pies.
    b: Disminución de 1100 pies.
    c: Aumento de 1300 pies.
  answer: c
  images:
  - ppa-figura-08.jpg
  explanation: En la Figura 8, sobre la línea de 3000 pies de altitud de presión:<br>A 30° F → altitud

    Kt de intensidad.
  options:
    a: 20 Kt de viento de frente y 15 Kt de cruzado.
    b: 16 Kt de viento de frente y 10 Kt de viento cruzado.
    c: 16Kt de viento cruzado y 10 Kt de frente.
  answer: c
  images:
  - ppa-key-x347.jpg
  explanation: 'Viento de 18 nudos a 60° de la pista:<br>Componente de frente = 18 × cos 60° = 18 × 0,5
    = 9 nudos<br>Componente cruzada = 18 × sen 60° = 18 × 0,866 ≈ 15,6 nudos<br>La opción más cercana
    es <b>16 nudos de viento cruzado y 10 de frente</b>. La opción b invierte las componentes: a 60° la
    componente cruzada es mayor que la de frente.'

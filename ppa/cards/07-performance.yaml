- id: k280
  source:
    key_item: 280
    chapter_question: '7.8'
  question: ¿Cuáles son los valores estándares de temperatura y presión para el nivel del mar?
  options:
    a: 15° C y 29.92" Hg.
    b: 59° C y 1013.2 milibares.
    c: 59° F y 29.92 milibares.
  answer: a
  explanation: La atmósfera estándar (ISA) a nivel del mar tiene <b>15° C (59° F) y 29.92 pulgadas de
    mercurio</b> (1013,2 hPa/milibares). La opción b usa 59 en grados Celsius en lugar de Fahrenheit,
    y la opción c expresa 29.92 en milibares en lugar de pulgadas de mercurio.
  theory: 'Valores estándar a nivel del mar: 29.92 pulgadas de mercurio y 15° C.'
- id: k287
  source:
    key_item: 287
    chapter_question: '7.9'
  question: ¿Qué factor tendería a aumentar la altitud de densidad en un aeropuerto dado?
  options:
    a: Un aumento en la presión barométrica.
    b: Un aumento en la temperatura ambiente.
    c: Una disminución en la humedad relativa.
  answer: b
  explanation: Un <b>aumento de la temperatura</b> hace al aire menos denso y, por lo tanto, aumenta la
    altitud de densidad. Un aumento de la presión barométrica (a) hace al aire más denso y la disminuye,
    y una disminución de la humedad relativa (c) también reduce la altitud de densidad.
  theory: Un día caluroso aumenta la altitud de densidad; las opciones a y c son incorrectas.
- id: k038
  source:
    key_item: 38
    chapter_question: '7.10'
  question: ¿Qué combinación de condiciones atmosféricas reducirán la performance del despegue y ascenso
    de la aeronave?
  options:
    a: Baja temperatura, baja humedad relativa y baja altitud de densidad.
    b: Alta temperatura, baja humedad relativa y baja altitud de densidad.
    c: Alta temperatura, alta humedad relativa y alta altitud de densidad.
  answer: c
  explanation: 'La alta temperatura, la alta humedad relativa y la alta altitud de densidad significan
    aire menos denso: el motor entrega menos potencia, la hélice produce menos tracción y el ala genera
    menos sustentación, por lo que la performance de despegue y ascenso disminuye. Las opciones a y b
    incluyen baja altitud de densidad, que en realidad mejora la performance.'
  theory: Un aumento de temperatura y humedad reduce la potencia del motor y la eficiencia de la hélice.
- id: k046
  source:
    key_item: 46
    chapter_question: '7.11'
  question: ¿Qué efecto tiene una disminución de la densidad del aire sobre la performance de una aeronave?
  options:
    a: Aumenta la performance del motor.
    b: Reduce la performance del ascenso.
    c: Aumenta la performance de despegue.
  answer: b
  explanation: 'Con menor densidad del aire el motor entrega menos potencia, la hélice es menos eficiente
    y el ala necesita mayor velocidad verdadera para generar la misma sustentación; por eso se <b>reduce
    la performance de ascenso</b>. Las opciones a y c son lo opuesto: la performance del motor y del despegue
    también empeoran.'
  theory: Una mayor altitud de densidad reduce considerablemente la potencia entregada y la eficiencia
    de la hélice.
- id: k054
  source:
    key_item: 54
    chapter_question: '7.12'
  question: (Refiérase a la Figura 8) ¿Cuál es el efecto de un aumento de la temperatura de 25 a 50° F
    en la altitud de densidad si la altitud de presión permanece en 5000 pies?
  options:
    a: Aumento de 1200 pies.
    b: Aumento de 1400 pies.
    c: Aumento de 1650 pies.
  answer: c
  images:
  - ppa-figura-08.jpg
  explanation: 'En la Figura 8, sobre la línea de 5000 pies de altitud de presión:<br>A 25° F → altitud
    de densidad ≈ 3850 pies<br>A 50° F → altitud de densidad ≈ 5500 pies<br>5500 − 3850 = <b>aumento de
    1650 pies</b><br>Verificación: 25° F a 50° F ≈ 14° C × 120 pies ≈ 1670 pies.'
  theory: 5500 − 3850 = aumento de 1650 pies.
- id: k062
  source:
    key_item: 62
    chapter_question: '7.13'
  question: '(Refiérase a la Figura 8) Determine la altitud de presión con una altitud indicada de 1380

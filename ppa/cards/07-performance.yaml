  question: Un aumento en la temperatura del aire o en la humedad o una disminución en la presión del
    aire (que causa una mayor altitud de densidad),
  options:
    a: mantiene considerablemente tanto la entrega de potencia como la eficacia de la hélice.
    b: disminuye considerablemente unicamente la eficacia de la hélice.
    c: disminuiría considerablemente tanto la entrega de potencia como la eficacia de la hélice.
  answer: c
  status: key_error
  official_key: b
  explanation: 'Mayor temperatura, mayor humedad o menor presión elevan la altitud de densidad: el aire
    es más tenue. El motor aspira menos masa de aire y su <b>potencia disminuye</b>, y la hélice actúa
    sobre menos aire, por lo que su <b>eficiencia también disminuye</b>. La opción b es incorrecta porque
    no solo cae la eficiencia de la hélice, sino también la potencia entregada por el motor.'

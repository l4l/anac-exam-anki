- id: k031
  source:
    key_item: 31
    chapter_question: '7.1'
  question: ¿Qué elementos se incluyen en el peso vacío de una aeronave?
  options:
    a: Combustible no utilizable y aceite que no se puede drenar.
    b: Sólo la célula, la planta de poder y el equipo opcional.
    c: Tanques de combustible y aceite de motor llenos en su totalidad.
  answer: a
  explanation: El peso vacío incluye la célula, la planta de poder, el equipo instalado en forma fija,
    el <b>combustible no utilizable</b> y el <b>aceite que no se puede drenar</b> (en definiciones más
    modernas, el aceite completo). La opción b omite el combustible no utilizable y el aceite no drenable;
    la opción c es incorrecta porque el combustible utilizable forma parte de la carga útil, no del peso
    vacío.
  theory: El peso vacío incluye el combustible no utilizable y el aceite que no se puede drenar.
- id: k109
  source:
    key_item: 109
    chapter_question: '7.2'
  question: Se carga una aeronave 50 kilos por encima del peso bruto máximo certificado. Si se drena el
    combustible para mantener el peso de la aeronave dentro de los límites, ¿cuánto combustible se debería
    drenar?
  options:
    a: 50 litros.
    b: 16,2 galones.
    c: 69,5 litros.
  answer: c
  explanation: La densidad de la nafta de aviación (AVGAS) es aproximadamente 0,72 kg/L.<br>Combustible
    a drenar = 50 kg ÷ 0,72 kg/L = 69,44 L ≈ <b>69,5 L</b><br>50 litros pesarían solo 36 kg, y 16,2 galones
    son unos 61 L (≈ 44 kg), insuficientes para eliminar el exceso.
  theory: 50 kg ÷ 0,720 kg/L = 69,44 L, redondeado a 69,50 L.
- id: k182
  source:
    key_item: 182
    chapter_question: '7.3'
  question: Si se carga una aeronave 110 libras por encima del peso bruto máximo certificado y se drena
    el combustible (gasolina) para mantener el peso de la aeronave dentro de los límites, ¿cuánto combustible
    se debería drenar?
  options:
    a: 10 galones.
    b: 12 galones.
    c: 15 galones.
  answer: c
  explanation: 'La nafta de aviación pesa aproximadamente 6 libras por galón.<br>Con el dato del enunciado:
    110 lb ÷ 6 lb/gal ≈ 18,3 gal (ninguna opción coincide).<br>El texto de teoría resuelve el mismo problema
    con 90 lb: 90 lb ÷ 6 lb/gal = <b>15 gal</b>.<br>Se toma 15 galones como respuesta, ya que es la única
    opción que se acerca a eliminar el exceso; 10 y 12 galones (60 y 72 lb) quedan muy por debajo.'
  theory: 'La teoría resuelve el problema con 90 libras: 90 ÷ 6 = 15 galones.'
  note: 'Dato inconsistente: 110 lb ÷ 6 lb/gal = 18,3 gal, que no está entre las opciones. La teoría ANAC
    resuelve el problema con 90 lb (= 15 gal).'
- id: k228
  source:
    key_item: 228
    chapter_question: '7.4'
  question: 'Si la temperatura del aire exterior (OAT) a una altitud dada es más cálida que la estándar,
    la altitud de densidad es:'
  options:
    a: Igual a la altitud de presión.
    b: Menor a la altitud de presión.
    c: Mayor a la altitud de presión.
  answer: c
  explanation: 'Cuando la temperatura es más cálida que la estándar, el aire es menos denso, por lo que
    la aeronave se comporta como si estuviera más alta: la <b>altitud de densidad es mayor que la altitud
    de presión</b>. Solo son iguales cuando la temperatura es exactamente la estándar (opción a), y es
    menor cuando el aire es más frío que el estándar (opción b).'
  theory: Si la temperatura supera la estándar, la altitud de densidad es mayor que la altitud de presión.

- id: k362
  source:
    key_item: 362
  question: Se informa que el viento se encuentra a 085° a 30 nudos y Ud. planea aterrizar en la Pista
    11. ¿Cuáles serán los componentes de viento de frente y viento cruzado?
  options:
    a: 13 Kt de frente / 25 Kt cruzado
    b: 13 Kt de frente / 27kt cruzado
    c: 13kt cruzado / 27kt de frente
  answer: c
  images:
  - ppa-key-x347.jpg
  explanation: 'Pista 11 = rumbo 110°; viento 085° a 30 nudos.<br>Ángulo = 110° − 085° = 25°<br>Componente
    de frente = 30 × cos 25° = 30 × 0,906 ≈ 27 nudos<br>Componente cruzada = 30 × sen 25° = 30 × 0,423
    ≈ 12,7 → 13 nudos<br>Resultado: <b>13 nudos cruzado / 27 nudos de frente</b>. Las opciones a y b asignan
    la componente mayor al viento cruzado, lo que solo ocurriría con un ángulo mayor a 45°.'
- id: k375
